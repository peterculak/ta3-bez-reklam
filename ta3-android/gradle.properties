org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
# Use Android Studio's bundled JDK so `./gradlew` works from the terminal
# even when the system Java (currently 25) is newer than Gradle 8.9 supports.
org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home
# R8 full mode's aggressive class merging was collapsing the synthetic continuation
# classes of two structurally-similar CoroutineWorker subclasses (AutoDownloadWorker,
# JojShowsRefreshWorker) into one, causing a ClassCastException crash-loop at launch.
# Compat mode keeps shrinking + obfuscation but skips that merging.
android.enableR8.fullMode=false
